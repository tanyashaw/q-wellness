# Render Blueprint: backend (FastAPI). The frontend goes on Vercel (see DEPLOY.md).
services:
  - type: web
    name: qwellness-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # The demo DB is SQLite on Render's temporary disk: it is re-seeded on every start, which also resets the demo.
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false          # paste in the Render dashboard, never in git
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: BOOKING_PROVIDER
        value: mock
      - key: SOCIAL_PROVIDER
        value: mock
      - key: MESSAGING_PROVIDER
        value: mock
      - key: TELEPHONY_PROVIDER
        value: browser
